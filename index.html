<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Chrome must not offer to translate the whole site: a translated page breaks the reader. -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#171322" />
    <meta name="color-scheme" content="dark light" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Bookeep" />
    <meta name="application-name" content="Bookeep" />

    <!-- seo:start -->
    <!-- Filled at build time by scripts/seo.ts: title, description, canonical, hreflang, Open Graph, JSON-LD. -->
    <!-- seo:end -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />


    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bookeep_theme_v2');
          // Dark is the house look; light only when the reader picked it.
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }

        if (typeof Map !== 'undefined' && typeof Map.prototype.getOrInsertComputed !== 'function') {
          Map.prototype.getOrInsertComputed = function (key, fn) {
            if (this.has(key)) return this.get(key);
            var value = fn(key);
            this.set(key, value);
            return value;
          };
        }
        if (typeof Promise !== 'undefined' && typeof Promise.withResolvers !== 'function') {
          Promise.withResolvers = function () {
            var resolve, reject;
            var promise = new Promise(function (res, rej) {
              resolve = res;
              reject = rej;
            });
            return { promise: promise, resolve: resolve, reject: reject };
          };
        }
        if (typeof Uint8Array !== 'undefined' && typeof Uint8Array.prototype.toHex !== 'function') {
          Uint8Array.prototype.toHex = function () {
            var hex = '';
            for (var i = 0; i < this.length; i += 1) hex += this[i].toString(16).padStart(2, '0');
            return hex;
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
