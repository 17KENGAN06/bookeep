    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "BookKeep",
        "url": "__SITE_URL__/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "Finnish and English books to read for pleasure. Open a cover and start.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bookkeep_theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }

        if (typeof Map !== 'undefined' && typeof Map.prototype.getOrInsertComputed !== 'function') {
          Map.prototype.getOrInsertComputed = function (key, fn) {
            if (this.has(key)) return this.get(key);
            var value = fn(key);
            this.set(key, value);
            return value;
          };
        }
        if (typeof Promise !== 'undefined' && typeof Promise.withResolvers !== 'function') {
          Promise.withResolvers = function () {
            var resolve, reject;
            var promise = new Promise(function (res, rej) {
              resolve = res;
              reject = rej;
            });
            return { promise: promise, resolve: resolve, reject: reject };
          };
        }
        if (typeof Uint8Array !== 'undefined' && typeof Uint8Array.prototype.toHex !== 'function') {
          Uint8Array.prototype.toHex = function () {
            var hex = '';
            for (var i = 0; i < this.length; i += 1) hex += this[i].toString(16).padStart(2, '0');
            return hex;
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
